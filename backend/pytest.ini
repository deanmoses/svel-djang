[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# -n auto: run across all cores via pytest-xdist. The suite is DB-bound and
# single-process runtime had grown past the pre-commit timeout; parallelizing
# is the biggest lever and needs no test changes.
#
# --dist worksteal: the default scheduler hands each worker a consecutive block
# of the collection and never reassigns it, so any uneven spread of slow tests
# leaves one worker grinding while the others idle. Worksteal lets an idle
# worker pull queued tests off the busiest one.
#
# -m "not analytics": the marker below costs more than the rest of the suite put
# together, so every bare invocation leaves it out and the callers that want it ask
# for it by name. A later -m on the command line replaces this one.
addopts = -n auto --dist worksteal -m "not analytics"
# Keeps a bare `pytest` out of edge_tests/, which sends requests to production.
testpaths = apps config scripts tests
python_files = tests.py test_*.py *_tests.py
markers =
    analytics: exercises the DuckDB analysis runner by building a foundation from
        scratch (~20s). Deselected by the addopts above, so a bare `pytest` skips it
        and `pytest -m analytics -n 0` is how you run it. `scripts/test-backend` and
        a pre-push hook do exactly that; CI does not, having no DuckDB CLI.
filterwarnings =
    error
    ignore:No directory at:UserWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
